name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    name: ShellCheck, bats and a test-mode run (${{ matrix.os }})
    # ubuntu-latest намеренно НЕ используется: метка мигрирует на Ubuntu 26 с
    # 19.10.2026, то есть дистрибутив под тестами поменялся бы сам, без единой
    # строчки в diff. Версии закреплены явно.
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Основная поддерживаемая платформа — на ней конфигуратор проверен
          # прогоном на живой машине.
          - os: ubuntu-24.04
            experimental: false
          # Проверка заявленной совместимости со старым LTS. Помечен как
          # experimental: bats в репозитории jammy заметно старше, и падение
          # здесь означает несовместимость тестовой обвязки, а не дефект шагов.
          - os: ubuntu-22.04
            experimental: true

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install tools (jq, shellcheck, bats)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq shellcheck bats

      - name: Install the packages the configurator configures
        # На чистом раннере нет sshd, nft, logrotate и fail2ban. Без них шаги ssh
        # и firewall завершаются как Skipped, и тесты содержимого (generated-content)
        # проверяли бы пустую песочницу, то есть зелёный CI ничего бы не доказывал.
        run: |
          sudo apt-get install -y -qq nftables openssh-server openssh-client \
               logrotate fail2ban
          # sshd -t требует наличия хост-ключей; пакет их генерирует, но на
          # раннере sshd не запускается, поэтому проверяем явно.
          test -f /etc/ssh/ssh_host_ed25519_key || sudo ssh-keygen -A

      - name: Tool versions
        run: |
          . /etc/os-release && echo "OS: ${PRETTY_NAME}"
          bash --version | head -1
          printf 'jq         %s\n' "$(jq --version)"
          printf 'shellcheck %s\n' "$(shellcheck --version | awk -F': ' '/^version:/{print $2}')"
          bats --version

      - name: Syntax check (bash -n)
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error::syntax error in $f"; fail=1; }
          done < <(find . -path ./.git -prune -o -name '*.sh' -print | sort)
          exit "$fail"

      - name: ShellCheck
        run: |
          shellcheck -x configure-linux.sh lib/*.sh lib/*/*.sh tests/run-tests.sh

      - name: Validate config.json against the schema
        run: ./configure-linux.sh --validate-config

      - name: Tests (bats, TAP format, as root)
        # От root, а не от пользователя runner: тесты generated-content прогоняют
        # сгенерированные конфиги через настоящие валидаторы, а `nft -c` требует
        # CAP_NET_ADMIN. Сам прогон безопасен — все тесты идут в --test-mode,
        # что отдельно проверяется набором testmode-isolation и шагом ниже.
        #
        # Провалившиеся тесты публикуются аннотациями (::error::): лог джоба
        # читается только по токену, а аннотации публичного репозитория доступны
        # через API без аутентификации.
        run: |
          set +e
          sudo -E ./tests/run-tests.sh --tap 2>&1 | tee /tmp/bats.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::group::Environment diagnostics"
            echo "whoami=$(whoami) HOME=$HOME TMPDIR=${TMPDIR:-unset}"
            echo "systemd=$([ -d /run/systemd/system ] && echo yes || echo no)"
            for t in nft sshd visudo logrotate fail2ban-client jq docker systemctl; do
              printf '  %-18s %s\n' "$t" "$(command -v $t || echo MISSING)"
            done
            echo "::endgroup::"
            grep -B1 -A10 '^not ok' /tmp/bats.log | head -120 | while IFS= read -r line; do
              printf '::error::%s\n' "${line#\# }"
            done
          fi
          exit "$rc"

      - name: Run all steps in test mode
        run: |
          jq '.Hostname.Name = "ci-runner"' config/config.json > /tmp/ci.json
          sudo -E ./configure-linux.sh --test-mode --run-all --config /tmp/ci.json

      - name: Verify test mode left the runner untouched
        run: |
          # /etc/nftables.conf на раннере существует (его ставит пакет nftables),
          # поэтому проверяется не наличие файла, а появление в нём НАШЕЙ таблицы.
          if [ -e /etc/nftables.conf ] && grep -q 'inet fw' /etc/nftables.conf; then
            echo "::error::test mode modified the runner /etc/nftables.conf"; exit 1
          fi
          if [ -e /root/lcfg-generated-keys ]; then
            echo "::error::test mode created the key directory"; exit 1
          fi
          echo "runner is clean"

      - name: Collect test-mode reports
        if: always()
        # Песочница создаётся через mktemp -d, то есть с правами 700 и владельцем
        # root (тесты идут под sudo). upload-artifact работает от пользователя
        # runner и на таком каталоге падает с EACCES. Отчёты копируются в
        # общедоступный каталог; приватных данных в них нет по построению —
        # шаг users пишет туда путь к ключу, но никогда не его содержимое.
        run: |
          sudo rm -rf /tmp/lcfg-artifacts
          sudo mkdir -p /tmp/lcfg-artifacts
          i=0
          for f in /tmp/LCFG-TestMode-*/testmode-report.json; do
            [ -e "$f" ] || continue
            i=$((i + 1))
            sudo cp "$f" "/tmp/lcfg-artifacts/testmode-report-${i}.json"
          done
          sudo chmod -R a+rX /tmp/lcfg-artifacts
          echo "reports collected: ${i}"

      - name: Test-mode report (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testmode-report-${{ matrix.os }}
          path: /tmp/lcfg-artifacts/
          if-no-files-found: ignore
          retention-days: 7
